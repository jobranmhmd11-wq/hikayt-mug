<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIKAYT MUG | متجر حكاية</title>
<meta name="description" content="متجر حكاية — أكواب وورد وأشجار صناعية وديكورات منزلية.">
<style>
:root{--ink:#20231f;--muted:#73766e;--cream:#f5efe5;--paper:#fffdfa;--sage:#65725d;--line:#e7dfd2;--accent:#b97961}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
button,input{font:inherit}.container{width:min(1160px,92%);margin:auto}
.top{background:#171a18;color:#fff;text-align:center;padding:9px;font-size:13px}
nav{position:sticky;top:0;z-index:50;background:#fffdfaf2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font:700 25px Georgia,serif}.logo small{display:block;font:10px Tahoma;color:var(--muted);letter-spacing:2px;margin-top:3px}
.links{display:flex;gap:24px;font-size:14px}.links a:hover{color:var(--accent)}
.cart{border:0;background:var(--ink);color:white;border-radius:12px;padding:11px 15px;cursor:pointer}
.count{background:var(--accent);border-radius:20px;padding:2px 7px;margin-right:5px}
.hero{padding:65px 0 55px}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:45px;align-items:center}
.eyebrow{font-weight:700;color:var(--sage);letter-spacing:.5px}
h1{font:700 clamp(45px,6vw,78px)/1.02 Georgia,serif;margin:12px 0 20px}
.hero p{font-size:18px;line-height:1.9;color:var(--muted);max-width:610px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}
.btn{border:0;display:inline-block;background:var(--ink);color:white;padding:13px 20px;border-radius:12px;font-weight:700;cursor:pointer}
.btn.light{background:white;color:var(--ink);border:1px solid var(--line)}
.hero-art{height:430px;position:relative}.hero-art img{width:100%;height:100%;object-fit:cover;border-radius:25px;box-shadow:0 20px 50px #3332}
.floating{position:absolute;bottom:-15px;left:-15px;width:42%;height:45%;object-fit:cover;border:9px solid var(--cream);border-radius:23px;box-shadow:0 15px 35px #3333}
.section{padding:72px 0}.alt{background:var(--paper)}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.head h2{font:700 40px Georgia,serif;margin:0 0 6px}.head p{color:var(--muted);margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.filter{border:1px solid var(--line);background:white;padding:9px 14px;border-radius:10px;cursor:pointer}.filter.active{background:var(--ink);color:white}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s}.product:hover{transform:translateY(-4px);box-shadow:0 15px 35px #26302112}
.product img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:pointer}.info{padding:16px}.info h3{margin:0 0 6px}.info p{color:var(--muted);font-size:13px;min-height:38px}.row{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.price{font-weight:700}.add{border:0;background:var(--cream);padding:9px 12px;border-radius:10px;cursor:pointer}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.feature{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:23px}.feature b{display:block;margin-bottom:7px}.feature p{margin:0;color:var(--muted);line-height:1.7;font-size:14px}
.contact{background:var(--sage);color:white;border-radius:25px;padding:42px}.contact p{color:#edf0e9;line-height:1.8;max-width:700px}
footer{background:#171a18;color:#ddd;padding:28px 0}.foot{display:flex;justify-content:space-between;gap:15px}.social{display:flex;gap:10px}.social a{border:1px solid #fff3;padding:8px 12px;border-radius:9px}
.drawer-bg{position:fixed;inset:0;background:#0008;z-index:100;display:none}.drawer-bg.show{display:block}
.drawer{position:absolute;right:0;top:0;height:100%;width:min(430px,94%);background:white;padding:22px;overflow:auto}
.drawer-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px}
.close{border:0;background:var(--cream);border-radius:10px;padding:8px 12px;cursor:pointer}.cart-item{display:grid;grid-template-columns:65px 1fr auto;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.cart-item img{width:65px;height:65px;object-fit:cover;border-radius:10px}.qty{display:flex;gap:7px;align-items:center}.qty button{border:1px solid var(--line);background:white;border-radius:7px;width:27px;height:27px;cursor:pointer}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:18px 0}.checkout{width:100%;margin-top:8px}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:#0009;z-index:110;display:none;align-items:center;justify-content:center;padding:20px}.modal-bg.show{display:flex}.modal{width:min(800px,100%);background:white;border-radius:22px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}.modal img{width:100%;height:100%;min-height:360px;object-fit:cover}.modal-info{padding:30px}.modal-info h2{font:700 35px Georgia,serif}.modal-info p{color:var(--muted);line-height:1.9}.modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:800px){.links{display:none}.hero-grid,.modal{grid-template-columns:1fr}.hero-art{height:330px}.grid{grid-template-columns:repeat(2,1fr)}.features{grid-template-columns:1fr}.head{display:block}.head .btn{margin-top:15px}.modal img{min-height:260px;max-height:330px}.foot{display:block}.social{margin-top:12px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}h1{font-size:48px}.hero{padding-top:45px}}

.admin-bg{position:fixed;inset:0;background:#0009;z-index:120;display:none;overflow:auto;padding:18px}.admin-bg.show{display:block}
.admin{width:min(900px,100%);margin:0 auto;background:#fff;border-radius:22px;padding:22px}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:14px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}
.admin input,.admin textarea,.admin select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
.admin textarea{min-height:85px;resize:vertical}.admin .full{grid-column:1/-1}
.admin-products{margin-top:25px;border-top:1px solid var(--line);padding-top:20px}.admin-product{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.admin-product img{width:60px;height:60px;border-radius:9px;object-fit:cover}.admin-product button{border:0;border-radius:9px;padding:8px 10px;cursor:pointer}
.admin-help{background:var(--cream);padding:12px;border-radius:12px;color:var(--muted);font-size:12px;line-height:1.7;margin:12px 0}
@media(max-width:600px){.admin-grid{grid-template-columns:1fr}.admin-product{grid-template-columns:55px 1fr}.admin-product .actions{grid-column:1/-1}}
</style>
